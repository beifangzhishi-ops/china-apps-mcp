name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Compile Python
        run: python -m compileall -q src scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1
          foreach ($file in $files) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $file.FullName -Raw))
          }
