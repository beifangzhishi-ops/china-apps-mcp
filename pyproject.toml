[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "china-apps-mcp"
version = "0.3.2"
description = "Personal MCP browser bridge for logged-in China-app pages, exposed through a local-only service and Tailscale Funnel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "starlette>=0.38,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-dotenv>=1.0,<2.0",
  "websockets>=14,<16",
]

[project.scripts]
china-apps-mcp = "china_apps_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/china_apps_mcp"]
